[package]
name = "koma"
description = "Koma (komawm) Agent-native Wayland tiling compositor microkernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["smithay-winit", "smithay-tty"]
smithay-winit = [
    "koma-lua/phodopus-vm",
    "koma-render/smithay-renderer",
    "dep:anyhow",
    "dep:base64",
    "dep:calloop",
    "dep:libc",
    "dep:regex",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:smithay",
    "dep:wayland-server",
]
smithay-tty = [
    "smithay-winit",
    "dep:smithay-drm-extras",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    "smithay/renderer_multi",
]

[dependencies]
koma-lua.workspace = true
koma-model.workspace = true
koma-proto.workspace = true
koma-render.workspace = true
koma-seat.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
calloop = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
smithay-drm-extras = { workspace = true, optional = true }
wayland-server = { workspace = true, optional = true }

[dependencies.smithay]
workspace = true
optional = true
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
]

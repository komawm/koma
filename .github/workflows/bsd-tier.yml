name: BSD tier

# FreeBSD 15.1 and OpenBSD 8.0 x86_64 portability checks and workspace test suites
# running inside real VMs via cross-platform-actions (since GitHub hosted runners lack native BSD).

on:
  workflow_dispatch:
  schedule:
    # Weekly FreeBSD x86_64 validation, Sundays 03:47 UTC.
    - cron: "47 3 * * 0"
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/bsd-tier.yml"
      - "scripts/freebsd-pkg-bootstrap.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/koma-proto/**"
      - "crates/koma/src/main.rs"
      - "crates/koma/src/security_context.rs"
      - "crates/koma/src/xwayland_satellite.rs"
      - "crates/koma/src/backend_tty.rs"
      - "crates/koma/src/config_watcher.rs"
      - "crates/komactl/**"
      - "crates/koma-overview/**"

permissions:
  contents: read

concurrency:
  group: bsd-tier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd-x86_64:
    name: FreeBSD x86_64 (Tier 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start FreeBSD 15.1 VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: "15.1"
          memory: 6G
          cpu_count: 8

      - name: Install FreeBSD build prerequisites
        run: |
          set -eux
          sh scripts/freebsd-pkg-bootstrap.sh \
            --packages "git pkgconf ca_root_nss curl python3 wayland libdrm mesa-libs mesa-dri libxkbcommon libinput libudev-devd seatd pixman dbus fontconfig sqlite3"

      - name: Install pinned Rust toolchain (rustup)
        run: |
          set -eux
          TOOLCHAIN="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$TOOLCHAIN" --component rustfmt --component clippy
          . "$HOME/.cargo/env"
          cargo --version
          rustc --version

      - name: Check workspace for FreeBSD
        run: |
          set -eux
          . "$HOME/.cargo/env"
          cargo check --workspace --all-targets --locked

      - name: Run workspace tests on FreeBSD
        run: |
          set -eux
          . "$HOME/.cargo/env"
          cargo test --workspace --locked -- --test-threads=4

  openbsd-x86_64:
    name: OpenBSD x86_64 (Tier 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start OpenBSD 8.0 VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: openbsd
          version: "8.0"
          architecture: x86-64
          memory: 6G
          cpu_count: 8

      - name: Install OpenBSD build prerequisites
        run: |
          set -eux
          if [ "$(id -u)" -eq 0 ]; then
            AS_ROOT=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            AS_ROOT="sudo"
          elif command -v doas >/dev/null 2>&1 && [ -f /etc/doas.conf ] && doas -n true >/dev/null 2>&1; then
            AS_ROOT="doas"
          elif command -v sudo >/dev/null 2>&1; then
            AS_ROOT="sudo"
          else
            echo "no privilege escalation helper found for pkg_add" >&2
            exit 1
          fi
          $AS_ROOT pkg_add -I rust pkgconf git
          # Mesa, fontconfig, and pixman live in Xenocara (/usr/X11R6) on OpenBSD;
          # probe optional ports individually so unavailable names do not abort setup.
          for pkg in wayland libinput-openbsd libudev-openbsd seatd libxkbcommon mesa dbus fontconfig pixman; do
            $AS_ROOT pkg_add -I "$pkg" || echo "optional port unavailable via pkg_add: $pkg"
          done
          rustc --version
          cargo --version

      - name: Test core crates and headless overview on OpenBSD
        run: |
          set -eux
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/X11R6/lib/pkgconfig"
          MIN_VER="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          CUR_VER="$(rustc --version | awk '{print $2}' | cut -d- -f1)"
          EXTRA_FLAGS=""
          if awk -v cur="$CUR_VER" -v req="$MIN_VER" '
            BEGIN {
              split(cur, c, "."); split(req, r, ".");
              cv = (c[1] + 0) * 1000000 + (c[2] + 0) * 1000 + (c[3] + 0);
              rv = (r[1] + 0) * 1000000 + (r[2] + 0) * 1000 + (r[3] + 0);
              exit !(cv < rv);
            }'; then
            echo "::warning::OpenBSD rustc $CUR_VER < rust-version $MIN_VER; passing --ignore-rust-version"
            EXTRA_FLAGS="--ignore-rust-version"
          fi
          # shellcheck disable=SC2086
          cargo test --locked $EXTRA_FLAGS \
            -p koma-proto \
            -p koma-model \
            -p koma-lua \
            -p koma-seat \
            -p komactl \
            -- --test-threads=4
          # shellcheck disable=SC2086
          cargo check --locked $EXTRA_FLAGS -p koma-overview --no-default-features --all-targets
          if pkg-config --exists wayland-client 2>/dev/null; then
            # shellcheck disable=SC2086
            cargo test --locked $EXTRA_FLAGS -p koma-overview -- --test-threads=4
          else
            echo "wayland-client.pc absent; skipping default koma-overview check on OpenBSD"
          fi
          if pkg-config --exists wayland-client xkbcommon dbus-1 fontconfig libinput libudev gbm 2>/dev/null; then
            # shellcheck disable=SC2086
            cargo check --locked $EXTRA_FLAGS --workspace --all-targets || echo "Full compositor workspace check failed on OpenBSD (diagnostic)"
          else
            echo "Compositor C pkg-config libraries not all present; skipping --workspace diagnostic probe on OpenBSD"
          fi

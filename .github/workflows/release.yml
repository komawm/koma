name: Release

# Development prereleases only (v0.0.x). v0.1.0 remains the first accepted
# product release and requires the acceptance evidence in the release plan.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as a dry run (X.Y.Z); never published"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve and check release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release version must be X.Y.Z, got '$version'"
            exit 1
          fi
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::release version $version does not match workspace.package.version $cargo_version"
            exit 1
          fi
          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate descriptors
        run: python3 scripts/check-infrastructure.py
      - name: Lint shell entry points
        run: shellcheck scripts/*.sh
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Resolve pinned Rust channel
        id: rust
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - name: Install Linux compositor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libudev-dev libinput-dev libseat-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-${{ steps.rust.outputs.channel }}
      # Same gates as CI; actionlint ran above through the pinned container.
      - name: Run repository gates
        run: just fmt-check typecheck clippy test-core test

  build:
    name: Build release archive (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SOURCE_DATE_EPOCH and the manifest revision resolve.
          fetch-depth: 0
      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve pinned Rust channel
        id: rust
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - name: Install Linux compositor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libudev-dev libinput-dev libseat-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}-${{ steps.rust.outputs.channel }}
      - name: Package release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ runner.temp }}/release
        run: bash scripts/package-release.sh --version "$VERSION" --target "$TARGET" --out "$OUT_DIR"
      - name: Smoke-test packaged binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ runner.temp }}/release
        run: |
          cd "$OUT_DIR"
          sha256sum -c SHA256SUMS
          tar -xzf "koma-$VERSION-$TARGET.tar.gz"
          "koma-$VERSION-$TARGET/bin/koma" --headless-check
          "koma-$VERSION-$TARGET/bin/komactl" validate "koma-$VERSION-$TARGET/examples/init.lua"
          rm -rf "koma-$VERSION-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koma-release-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release/koma-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release checksums
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: koma-release-${{ needs.verify.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Generate unified SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: |
          shopt -s nullglob
          tarballs=(koma-*.tar.gz)
          if [ "${#tarballs[@]}" -ne 2 ]; then
            echo "::error::expected 2 release tarballs, found ${#tarballs[*]}"
            exit 1
          fi
          LC_ALL=C sha256sum "${tarballs[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koma-release-${{ needs.verify.outputs.version }}
          path: |
            ${{ runner.temp }}/release/koma-*.tar.gz
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: koma-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Verify downloaded checksums
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c SHA256SUMS
      - name: Generate release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header = re.compile(r"^## \[" + re.escape(version) + r"\]")
          body, inside = [], False
          for line in lines:
              if header.match(line):
                  inside = True
                  continue
              if inside and line.startswith("## ["):
                  break
              if inside:
                  body.append(line)
          text = "\n".join(body).strip()
          if not text:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty or missing")
          notes = (
              "> Development prerelease on the 0.0.x incubation line. It is not the "
              "accepted v0.1.0 product release and makes no hardware, DRM/KMS, "
              "security or desktop-support claims.\n\n"
              + text
              + "\n\n### Verify the download\n\n```sh\nsha256sum -c SHA256SUMS\n```\n"
          )
          Path(os.environ["NOTES_FILE"]).write_text(notes, encoding="utf-8")
          PY
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ runner.temp }}/release
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          shopt -s nullglob
          assets=("$RELEASE_DIR"/koma-*.tar.gz "$RELEASE_DIR/SHA256SUMS")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --prerelease \
              --verify-tag \
              --title "Koma $TAG (development prerelease)" \
              --notes-file "$NOTES_FILE"
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Validate descriptors
        run: python3 scripts/check-infrastructure.py
      - name: Validate agent skill catalog
        run: python3 scripts/check-skills.py
      - name: Lint shell entry points
        run: shellcheck scripts/*.sh
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  quality:
    name: Rust (${{ matrix.gate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt-check, typecheck, clippy, test-core, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve pinned Rust channel
        id: rust
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - name: Install Linux compositor build dependencies
        if: matrix.gate != 'fmt-check'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libudev-dev libinput-dev libseat-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libfontconfig1-dev libpipewire-0.3-dev libclang-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-${{ steps.rust.outputs.channel }}
      # No continue-on-error: inherited source/dependency failures remain visible.
      - name: Run repository gate
        env:
          GATE: ${{ matrix.gate }}
        run: just "$GATE"

  linux-arm64:
    name: Rust (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve pinned Rust channel
        id: rust
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - name: Install Linux compositor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libudev-dev libinput-dev libseat-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libfontconfig1-dev libpipewire-0.3-dev libclang-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-arm64-${{ steps.rust.outputs.channel }}
      - name: Run repository gates
        run: just typecheck test

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve pinned Rust channel
        id: rust
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: Check dependencies (advisories, bans, licenses, sources)
        run: just deny

  nix:
    name: Nix flake (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: komawm
          skipPush: true
      - name: Evaluate and build Nix package
        run: |
          nix eval --no-write-lock-file --raw .#packages.x86_64-linux.koma.drvPath
          printf '\n'
          nix eval --no-write-lock-file --raw .#packages.aarch64-linux.koma.drvPath
          printf '\n'
          nix build --no-write-lock-file -L .#packages.x86_64-linux.koma
